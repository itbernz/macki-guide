/* ---------- Password gate ---------- */
function checkPassword(){
  const val = document.getElementById('gateInput').value;
  if(val === SITE_PASSWORD){
    localStorage.setItem('mackiAuthed', 'true');
    document.body.classList.remove('locked');
    document.getElementById('gate').style.display = 'none';
  } else {
    document.getElementById('gateError').textContent = 'Wrong password, try again.';
  }
}
document.getElementById('gateInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') checkPassword();
});
if(localStorage.getItem('mackiAuthed') === 'true'){
  document.body.classList.remove('locked');
  document.getElementById('gate').style.display = 'none';
}

/* ---------- Tabs ---------- */
const tabs = [
  {id:'emergency', label:'🚨 Emergency'},
  {id:'routine', label:'🕐 Routine'},
  {id:'food', label:'🍲 Food'},
  {id:'meds', label:'💊 Meds'},
  {id:'enrichment', label:'🧩 Activities'},
  {id:'walks', label:'🦮 Walks & Gear'},
  {id:'behaviour', label:'⚠️ Behaviour & Triggers'},
  {id:'house', label:'🏠 House'},
  {id:'commands', label:'🔘 House Buttons'},
  {id:'notes', label:'📝 Notes'}
];
const tabbar = document.getElementById('tabbar');
tabs.forEach((t,i)=>{
  const b = document.createElement('button');
  b.className = 'tab-btn' + (i===0 ? ' active' : '');
  b.textContent = t.label;
  b.onclick = () => showTab(t.id);
  b.id = 'btn-' + t.id;
  tabbar.appendChild(b);
});
function showTab(id){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('panel-'+id).classList.add('active');
  document.getElementById('btn-'+id).classList.add('active');
  window.scrollTo({top:0, behavior:'instant'});
}

/* ---------- Cloudinary upload helper ---------- */
function uploadItemPhoto(key, btnEl){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    btnEl.textContent = 'Uploading...';
    btnEl.disabled = true;
    try{
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
        method: 'POST',
        body: formData
      });
      const data = await res.json();
      if(data.secure_url){
        const box = document.getElementById('photo-' + key);
        box.style.backgroundImage = 'url(' + data.secure_url + ')';
        box.querySelector('.icon-fallback')?.remove();
        const resultEl = document.getElementById('result-' + key);
        resultEl.textContent = data.secure_url;
        resultEl.classList.add('show');
        btnEl.textContent = 'Copy URL below into ITEM_PHOTOS.' + key;
      } else {
        btnEl.textContent = 'Upload failed, try again';
      }
    }catch(err){
      btnEl.textContent = 'Upload failed, try again';
    }
    btnEl.disabled = false;
  };
  input.click();
}

/* ---------- House buttons ---------- */
function triggerHouseButton(id){
  const url = HOUSE_BUTTON_URLS[id];
  if(!url){
    alert('No link added for this button yet.');
    return;
  }
  window.open(url, '_blank');
}

function itemPhotoDiv(key, icon){
  const url = ITEM_PHOTOS[key];
  const bg = url ? `style="background-image:url(${url})"` : '';
  const fallback = url ? '' : `<span class="icon-fallback">${icon}</span>`;
  return `<div class="item-photo" id="photo-${key}" ${bg}>${fallback}</div>`;
}

    <div class="button-grid" id="buttonGrid"></div>
  </div>
</section>

<section id="panel-notes" class="panel">
  <div class="card">
    <h2>📝 Anything else</h2>
    <p class="editme">Space for anything that doesn't fit elsewhere, extra videos, one-off instructions, updated contacts, etc.</p>
  </div>
</section>
`;

/* ---------- Build the photo grid (owner upload tools included) ---------- */
const ITEMS = [
  {key:'lickymat', icon:'🧽', label:'Licky mat', sub:'red Kong or green headspace mat, peanut butter/yoghurt/blueberries/biscuits'},
  {key:'kong', icon:'🔵', label:'Blue/red Kong toy', sub:'fill and freeze if you like'},
  {key:'wobble', icon:'🟡', label:'Yellow/red wobble toy', sub:''},
  {key:'tprolls', icon:'🧻', label:'Toilet paper rolls', sub:'stuff with treats, seal the ends'},
  {key:'towel', icon:'🔷', label:'Dark blue towel', sub:'roll treats up inside'},
  {key:'redball', icon:'🔴', label:'Red ball', sub:'with biscuits inside'},
  {key:'bone', icon:'🦴', label:'Pork twist / rawhide bone', sub:''},
  {key:'tub', icon:'📦', label:'Rectangular tub', sub:'the one with paper scraps, fill with biscuits/treats'}
];
document.getElementById('itemGrid').innerHTML = ITEMS.map(it => `
  <div class="item-card">
    ${itemPhotoDiv(it.key, it.icon)}
    <div class="item-label">${it.label}${it.sub ? '<small>'+it.sub+'</small>' : ''}</div>
    <button class="upload-btn" onclick="uploadItemPhoto('${it.key}', this)">📷 Get upload link</button>
    <div class="upload-result" id="result-${it.key}"></div>
  </div>
`).join('');

/* ---------- Build the house buttons ---------- */
const BUTTONS = [
  {key:'musicon', icon:'🎵', label:'Music On', style:'music'},
  {key:'musicoff', icon:'🔇', label:'Music Off', style:'music'},
  {key:'lightson', icon:'💡', label:'All Lights On', style:'lights'},
  {key:'lightsoff', icon:'🌙', label:'All Lights Off', style:'lights'}
];
document.getElementById('buttonGrid').innerHTML = BUTTONS.map(b => `
  <div class="house-btn-card">
    <button class="house-btn ${b.style}" onclick="triggerHouseButton('${b.key}')" ${HOUSE_BUTTON_URLS[b.key] ? '' : 'disabled'}>${b.icon} ${b.label}</button>
    <div class="house-btn-note">${HOUSE_BUTTON_URLS[b.key] ? '' : 'No link set yet, add it in HOUSE_BUTTON_URLS'}</div>
  </div>
`).join('');
</script>
